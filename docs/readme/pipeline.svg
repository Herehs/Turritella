<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="990" viewBox="0 0 1300 990" role="img" aria-labelledby="title desc">
<title id="title">Локальный конвейер Turritella</title>
<desc id="desc">Аудио приводится к моно 16 кГц. Интервалы VAD и диаризации согласуются, затем выполняются ASR, пунктуация Qwen и сохранение результата. Все вычисления выполняются на Android-устройстве.</desc>
